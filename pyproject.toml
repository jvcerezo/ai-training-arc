[project]
name = "thcm"
version = "0.0.1"
description = "Tokenless T-HCM (Transformer-Holographic Concept-Manifold) engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

# NOTE: torch is intentionally NOT pinned here. The backend for the AMD RX 9060 XT
# (RDNA4) is native Windows ROCm 7.2.1: AMD's cp312 torch wheels from
# repo.radeon.com, installed into a Python 3.12 venv. See the README "GPU backend"
# section for the exact install, and src/thcm/utils/device.py for the preflight.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
